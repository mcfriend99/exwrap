changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - octocat
  categories:
    - title: Breaking Changes 🛠
      labels:
        - Semver-Major
        - breaking-change
      exclude:
        labels:
          - dependencies
    - title: Exciting New Features 🎉
      labels:
        - Semver-Minor
        - enhancement
      exclude:
        labels:
          - dependencies
    - title: Other Changes
      labels:
        - "*"